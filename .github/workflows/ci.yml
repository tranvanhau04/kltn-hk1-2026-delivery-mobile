name: React Native CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./DeliveryApp # Bắt buộc phải trỏ vào đây
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './DeliveryApp/package-lock.json'
    - name: Install Dependencies
      run: npm ci
    - name: Run Linter
      run: npm run lint